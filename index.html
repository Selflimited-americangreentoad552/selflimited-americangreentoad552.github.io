<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site de Plotagens de Carros</title>
    <link rel="stylesheet" href="style.css">
    <!-- Adicionando FontAwesome para ícones de redes sociais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- CONTAINER PRINCIPAL -->
    <div class="main-container" style="background-image: url('background.jpg');">
        
        <!-- PÁGINA 1: BEM-VINDO -->
        <section id="welcome-page" class="page active-page">
            <div class="overlay">
                <div class="content">
                    <h1>Bem-vindo!</h1>
                    <p>Explore as melhores plotagens e códigos para seus carros.</p>
                    
                    <div class="social-icons">
                        <a href="seu_link_instagram_aqui" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
                        <a href="seu_link_tiktok_aqui" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
                        <a href="seu_link_youtube_aqui" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
                    </div>

                    <a href="#plot-page" class="btn" id="go-to-plots">Área das Plotagens</a>
                </div>
            </div>
        </section>

        <!-- PÁGINA 2: ÁREA DAS PLOTAGENS -->
        <section id="plot-page" class="page">
            <div class="overlay">
                <div class="content">
                    <h2>Área das Plotagens</h2>
                    <a href="#welcome-page" class="btn-back" id="back-to-home">Voltar</a>
                    
                    <!-- Plotagem 1 -->
                    <div class="plot-item">
                        <!-- Imagem do Carro 1 - Substitua o link se tiver uma imagem real -->
                        <img src="https://via.placeholder.com/600x300/111/f00?text=Carro+Plotagem+1" alt="Plotagem Carro 1">
                        <div class="code-boxes">
                            <div class="code-container">
                                <label>Corpo do Carro</label>
                                <textarea readonly onclick="this.select()">CÓDIGO_CORPO_CARRO_1_AQUI</textarea>
                                <button class="copy-btn">Copiar</button>
                            </div>
                            <div class="code-container">
                                <label>Vidro do Carro</label>
                                <textarea readonly onclick="this.select()">CÓDIGO_VIDRO_CARRO_1_AQUI</textarea>
                                <button class="copy-btn">Copiar</button>
                            </div>
                        </div>
                    </div>

                    <!-- Plotagem 2 -->
                    <div class="plot-item">
                        <!-- Imagem do Carro 2 - Substitua o link se tiver uma imagem real -->
                        <img src="https://via.placeholder.com/600x300/111/f00?text=Carro+Plotagem+2" alt="Plotagem Carro 2">
                        <div class="code-boxes">
                            <div class="code-container">
                                <label>Corpo do Carro</label>
                                <textarea readonly onclick="this.select()">CÓDIGO_CORPO_CARRO_2_AQUI</textarea>
                                <button class="copy-btn">Copiar</button>
                            </div>
                            <div class="code-container">
                                <label>Vidro do Carro</label>
                                <textarea readonly onclick="this.select()">CÓDIGO_VIDRO_CARRO_2_AQUI</textarea>
                                <button class="copy-btn">Copiar</button>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </section>
    </div>

    <!-- Script Simples para Alternar Páginas e Botão Copiar -->
    <script>
        // Alternar páginas
        const welcomePage = document.getElementById('welcome-page');
        const plotPage = document.getElementById('plot-page');
        const goToPlotsBtn = document.getElementById('go-to-plots');
        const backToHomeBtn = document.getElementById('back-to-home');

        goToPlotsBtn.addEventListener('click', function(e) {
            e.preventDefault();
            welcomePage.classList.remove('active-page');
            plotPage.classList.add('active-page');
        });

        backToHomeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            plotPage.classList.remove('active-page');
            welcomePage.classList.add('active-page');
        });

        // Funcionalidade de Botão Copiar
        const copyButtons = document.querySelectorAll('.copy-btn');
        copyButtons.forEach(button => {
            button.addEventListener('click', function() {
                const textarea = this.previousElementSibling;
                textarea.select();
                document.execCommand('copy');
                this.innerText = 'Copiado!';
                setTimeout(() => {
                    this.innerText = 'Copiar';
                }, 2000);
            });
        });
    </script>
</body>
</html>
