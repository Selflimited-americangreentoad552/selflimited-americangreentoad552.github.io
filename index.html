<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site de Plotagens</title>
    <!-- Ligação com o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Ícones de redes sociais (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- CONTAINER COM O FUNDO DO CARRO -->
    <div class="main-container">

        <!-- PÁGINA 1: BOAS-VINDAS -->
        <section id="welcome-page" class="page active-page">
            <div class="overlay">
                <div class="content">
                    <h1>salve tropa ✌️</h1>
                    <p>Explore as melhores plotagens e códigos para seus carros.</p>

                    <!-- Botões das Redes Sociais (Acima da Área das Plotagens) -->
                    <div class="social-buttons" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; align-items: center;">
                        <a href="https://www.youtube.com/@RedSans00215" target="_blank" class="btn btn-social btn-youtube" style="background-color: #ff0000; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 280px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                            <i class="fab fa-youtube" style="font-size: 1.3rem;"></i> Canal do YouTube
                        </a>

                        <a href="https://www.tiktok.com/@souzx_44215" target="_blank" class="btn btn-social btn-tiktok" style="background-color: #000000; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 280px; border: 1px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                            <i class="fab fa-tiktok" style="font-size: 1.3rem;"></i> Perfil do TikTok
                        </a>
                    </div>

                    <!-- Botão Principal das Plotagens -->
                    <a href="#plot-page" class="btn" id="go-to-plots">Área das Plotagens</a>
                </div>
            </div>
        </section>

        <!-- PÁGINA 2: ÁREA DAS PLOTAGENS -->
        <section id="plot-page" class="page">
            <div class="overlay">
                <div class="content">
                    <h2>Área das Plotagens</h2>
                    <a href="#welcome-page" class="btn-back" id="back-to-home">Voltar</a>

                    <!-- Plotagem 1 -->
                    <div class="plot-item">
                        <img src="20260725_174843_0000.png" alt="Plotagem Carro 1" class="car-preview">
                        <div class="code-boxes">
                            <div class="code-container">
                                <label>Corpo do Carro</label>
                                <textarea readonly onclick="this.select()">CÓDIGO_CORPO_CARRO_1</textarea>
                                <button class="copy-btn">Copiar</button>
                            </div>
                            <div class="code-container">
                                <label>Vidro do Carro</label>
                                <textarea readonly onclick="this.select()">CÓDIGO_VIDRO_CARRO_1</textarea>
                                <button class="copy-btn">Copiar</button>
                            </div>
                        </div>
                    </div>

                    <!-- Plotagem 2 -->
                    <div class="plot-item">
                        <img src="20260725_181223_0000.png" alt="Plotagem Carro 2" class="car-preview">
                        <div class="code-boxes">
                            <div class="code-container">
                                <label>Corpo do Carro</label>
                                <textarea readonly onclick="this.select()">CÓDIGO_CORPO_CARRO_2</textarea>
                                <button class="copy-btn">Copiar</button>
                            </div>
                            <div class="code-container">
                                <label>Vidro do Carro</label>
                                <textarea readonly onclick="this.select()">CÓDIGO_VIDRO_CARRO_2</textarea>
                                <button class="copy-btn">Copiar</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>

    </div>

    <!-- Script para navegar entre a tela de início e as plotagens -->
    <script>
        const welcomePage = document.getElementById('welcome-page');
        const plotPage = document.getElementById('plot-page');
        const goToPlotsBtn = document.getElementById('go-to-plots');
        const backToHomeBtn = document.getElementById('back-to-home');

        goToPlotsBtn.addEventListener('click', function(e) {
            e.preventDefault();
            welcomePage.classList.remove('active-page');
            plotPage.classList.add('active-page');
        });

        backToHomeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            plotPage.classList.remove('active-page');
            welcomePage.classList.add('active-page');
        });

        // Botão de copiar
        const copyButtons = document.querySelectorAll('.copy-btn');
        copyButtons.forEach(button => {
            button.addEventListener('click', function() {
                const textarea = this.previousElementSibling;
                textarea.select();
                document.execCommand('copy');
                this.innerText = 'Copiado!';
                setTimeout(() => {
                    this.innerText = 'Copiar';
                }, 2000);
            });
        });
    </script>
</body>
</html>
